name: Deploy web to Azure PROD

# RF-ENV-02: GitHub → Azure PROD. NO toca QAS ni Cloudflare (deploy-azure-qas.yml / deploy-cloudflare.yml).
#
# RF-ENV-02 promote: dispara en la rama integrate (hoy) y en main (desde el merge).
# OIDC: federated credential de id-github-qavante-prod debe cubrir
#   repo:tooxs-digital/qavante-web:ref:refs/heads/main
#   además de refs/heads/integrate/main-azure-prod.
# api.qavante.com ya apunta a Container Apps (cutover DNS). Bake canónico
# para que las cookies Domain=.qavante.com viajen con el front en app.qavante.com.
# Client ID de esa identidad (no es secreto; el trust es el federated credential).
# Tenant/subscription: mismos secrets de repo que QAS.

on:
  push:
    branches:
      - main
      - integrate/main-azure-prod
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "next.config.ts"
      - ".github/workflows/deploy-azure-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-azure-prod-web
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy (azure prod)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      ACR: acrqavanteprod
      IMAGE_REPO: acrqavanteprod.azurecr.io/qavante-web
      APP: ca-qavante-web-prod
      RG: qavante-prod
      NEXT_PUBLIC_API_URL: https://api.qavante.com
      AZURE_CLIENT_ID_PROD: 47315a6f-65c3-4780-a6cc-d436d401353d

    steps:
      - uses: actions/checkout@v5

      - name: Require Azure OIDC secrets
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "${TENANT_ID}" ] || [ -z "${SUBSCRIPTION_ID}" ]; then
            echo "::error::Faltan AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID. No se deploya a PROD."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          set -euo pipefail
          TAG="prod-${GITHUB_SHA}"
          az acr login --name "${ACR}"
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-arg NEXT_PUBLIC_APP_ENV=prod \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAADpQkYv0x2Mvz7Xp \
            -t "${IMAGE_REPO}:${TAG}" \
            -t "${IMAGE_REPO}:prod" \
            .
          docker push "${IMAGE_REPO}:${TAG}"
          docker push "${IMAGE_REPO}:prod"
          echo "IMAGE=${IMAGE_REPO}:${TAG}" >> "${GITHUB_ENV}"

      - name: Update Container App
        run: |
          set -euo pipefail
          az containerapp update -n "${APP}" -g "${RG}" --image "${IMAGE}"
          az containerapp revision list -n "${APP}" -g "${RG}" \
            --query "[?properties.active].{name:name, health:properties.healthState, traffic:properties.trafficWeight}" \
            -o table

      - name: Health
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 \
            "https://ca-qavante-web-prod.nicedesert-33644b01.chilecentral.azurecontainerapps.io/login-correo" >/dev/null
          echo "web login-correo 200"
