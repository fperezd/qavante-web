name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/install-playwright-ci.check.mjs

  qa-rediseno:
    # Los criterios de aceptación del rediseño (ESPECIFICACION §5) que se pueden
    # verificar leyendo el código. NO bloquea por los que hay que mirar en pantalla.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run qa:rediseno

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  test-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `chromium-headless-shell` es lo que @vitest/browser-playwright usa por
      # default (no el chromium full). Si solo instalamos `chromium` el job
      # falla con "Executable doesn't exist at chrome-headless-shell".
      - run: bash scripts/install-playwright-ci.sh chromium chromium-headless-shell
      - run: npm run test:storybook

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size budget (Kit C0 DoD sec 5.2)
        run: npm run size:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/install-playwright-ci.sh chromium
      - run: npm run e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (Next.js production)
        run: npm run build
      - name: Lighthouse mobile (Kit C0 DoD sec 5.2 — /login + /credenciales >=85)
        run: npm run lighthouse
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          # `.lighthouseci` es un directorio-punto y actions/upload-artifact >=4.4 excluye los
          # ocultos por defecto: sin esto, TODAS las corridas terminaban en "No files were found
          # with the provided path" y no quedaba archivado un solo reporte. Por eso el umbral de
          # /inicio se discutió dos veces de memoria en vez de con los LHR (#37).
          include-hidden-files: true
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: gitleaks detect --no-banner --redact --verbose

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Critical advisories block immediately. High residuals are explicitly
      # tracked in docs/security/dependency-risk-register.md and are not hidden
      # by an automatic --force upgrade.
      - run: npm audit --audit-level=critical
