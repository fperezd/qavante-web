name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: route changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      contract: ${{ steps.filter.outputs.contract }}
      visual: ${{ steps.filter.outputs.visual }}
      e2e: ${{ steps.filter.outputs.e2e }}
      performance: ${{ steps.filter.outputs.performance }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      governance: ${{ steps.filter.outputs.governance }}
    steps:
      # En push a main, paths-filter compara contra github.event.before. Con
      # fetch-depth: 1 ese SHA no está en el clone y el action intenta
      # `git fetch origin <before>`; con persist-credentials: false falla en
      # repos privados. Historial completo evita ese fetch extra.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'public/**'
              - '*.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            contract:
              - 'docs/contracts/**'
              - 'src/lib/api/types.ts'
              - 'scripts/openapi-snapshot.mjs'
            visual:
              - 'src/**/*.tsx'
              - 'src/**/*.css'
              - 'src/**/*.stories.*'
              - '.storybook/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
            e2e:
              - 'src/**'
              - 'tests/e2e/**'
              - 'playwright*.ts'
              - 'package.json'
              - 'package-lock.json'
            performance:
              - 'src/**'
              - 'public/**'
              - 'next.config.ts'
              - 'open-next.config.ts'
              - '.lighthouserc.json'
              - 'package.json'
              - 'package-lock.json'
            dependencies:
              - 'package.json'
              - 'package-lock.json'
            governance:
              - '.github/change-evidence.mjs'
              - '.github/change-evidence.check.mjs'
              - '.github/release-gate.mjs'
              - '.github/release-gate.check.mjs'
              - '.github/release/**'
              - '.github/workflows/change-evidence.yml'
              - '.github/workflows/tooxs-factory-conformance.yml'
              - 'scripts/tooxs_factory_check.py'
              - 'docs/factory/**'

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, static QA and types
        run: |
          npm run lint
          npm run qa:rediseno
          npm run typecheck
          node scripts/install-playwright-ci.check.mjs
      - name: Contract drift
        if: needs.changes.outputs.contract == 'true'
        run: |
          npm run contract:check
          git diff --exit-code -- src/lib/api/types.ts

  test:
    name: unit coverage
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  storybook:
    name: storybook
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/install-playwright-ci.sh chromium chromium-headless-shell
      - run: npm run test:storybook

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size:check

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/install-playwright-ci.sh chromium
      - run: npm run e2e
      - run: npm run e2e:decision-brief

  lighthouse:
    name: lighthouse
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --no-banner --redact --verbose

  dependency-audit:
    name: dependency-audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=critical

  governance:
    name: governance guards
    needs: changes
    if: needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node .github/change-evidence.check.mjs
      - run: node .github/release-gate.check.mjs
      - run: python scripts/tooxs_factory_check.py --repo . --json

  required:
    name: ci-required
    if: always()
    needs:
      [
        changes,
        quality,
        test,
        storybook,
        build,
        e2e,
        lighthouse,
        secrets-scan,
        dependency-audit,
        governance,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result));
            if (needs.changes.result !== "success" || needs["secrets-scan"].result !== "success" || bad.length) {
              console.error("CI no concluyente:", bad.length ? bad : needs);
              process.exit(1);
            }
            console.log("Todos los checks aplicables terminaron correctamente.");
          '
