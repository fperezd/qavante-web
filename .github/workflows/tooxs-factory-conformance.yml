name: Tooxs Factory Conformance

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/factory/**"
      - "scripts/tooxs_factory_check.py"
      - ".github/workflows/tooxs-factory-conformance.yml"
      - ".github/workflows/deploy-cloudflare.yml"
      - ".github/release-gate.mjs"
      - ".github/release-gate.check.mjs"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/factory/**"
      - "scripts/tooxs_factory_check.py"
      - ".github/workflows/deploy-cloudflare.yml"
      - ".github/release-gate.mjs"
      - ".github/release-gate.check.mjs"

permissions:
  contents: read

jobs:
  conformance:
    name: factory-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Tooxs AI Factory Framework conformance
        run: python scripts/tooxs_factory_check.py --repo . --json
      - name: Validate risk-routed review gate
        run: node .github/gate-review.check.mjs
      - name: Validate SHA-bound production release gate
        run: node .github/release-gate.check.mjs
