name: Release to Cloudflare Workers

# T06: producción no sigue automáticamente a main. El BO selecciona el SHA
# completo. En Team privado no hay reviewer nativo de environment; main debe
# permanecer protegida y el BO deja un sign-off anclado al SHA. La configuración
# detallada de branch protection se verifica operacionalmente, no con token.
# El preflight vuelve a comprobar CI + review en los SHAs exactos antes de
# construir una sola vez el bundle que luego se promueve sin recompilar.
# P1 externo: PRODUCTION_* debe existir exclusivamente en el environment; los
# secrets repo-level legacy deben eliminarse/rotarse. YAML no puede certificar
# por sí solo el scope de un secret almacenado en GitHub.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA completo (40 caracteres) del tip actual de main"
        required: true
        type: string

concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.gate.outputs.pull_request_number }}
      pull_request_head_sha: ${{ steps.gate.outputs.pull_request_head_sha }}
      release_tree_sha: ${{ steps.gate.outputs.release_tree_sha }}
      risk: ${{ steps.gate.outputs.risk }}
    steps:
      - uses: actions/checkout@v7
        with:
          # El código del gate debe venir del mismo main que definió el workflow,
          # nunca de un SHA arbitrario controlado por el input.
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Verify CI, review, tree, protected main and BO sign-off
        id: gate
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const gate = await import("${{ github.workspace }}/.github/release-gate.mjs");
            await gate.verifyReleaseGate({
              github,
              context,
              core,
              requestedSha: process.env.RELEASE_SHA,
            });

  build:
    name: Build immutable release artifact
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build OpenNext worker bundle once
        env:
          NEXT_PUBLIC_API_URL: https://api.qavante.com
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADpQkYv0x2Mvz7Xp
        run: npm run build:cloudflare
      - name: Package immutable bundle and base manifest
        id: bundle
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TREE_SHA: ${{ needs.verify.outputs.release_tree_sha }}
          REVIEW_SHA: ${{ needs.verify.outputs.pull_request_head_sha }}
          PR_NUMBER: ${{ needs.verify.outputs.pull_request_number }}
          RISK: ${{ needs.verify.outputs.risk }}
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf qavante-web-open-next.tgz .open-next
          bundle_sha256="$(sha256sum qavante-web-open-next.tgz | cut -d' ' -f1)"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("node:fs");fs.writeFileSync("release-manifest.json",JSON.stringify({schema_version:1,repository:process.env.GITHUB_REPOSITORY,workflow_run:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,release_sha:process.env.RELEASE_SHA,release_tree_sha:process.env.RELEASE_TREE_SHA,reviewed_pull_request:Number(process.env.PR_NUMBER),reviewed_head_sha:process.env.REVIEW_SHA,risk:process.env.RISK,bundle_sha256:process.argv[1]},null,2)+"\n")' "$bundle_sha256"
      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.release_sha }}
          path: |
            qavante-web-open-next.tgz
            release-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Human-gated production promotion
    runs-on: ubuntu-latest
    needs: [verify, build]
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    environment:
      name: production
      url: https://app.qavante.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.release_sha }}
      - name: Verify immutable bundle digest
        shell: bash
        env:
          EXPECTED_BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: echo "$EXPECTED_BUNDLE_SHA256  qavante-web-open-next.tgz" | sha256sum --check --strict
      - name: Capture rollback candidates before promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --json > rollback-candidates.json
      - name: Revalidate exact gate after build
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const gate = await import("${{ github.workspace }}/.github/release-gate.mjs");
            await gate.verifyReleaseGate({
              github,
              context,
              core,
              requestedSha: process.env.RELEASE_SHA,
            });
      - name: Promote exact bundle without rebuilding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        shell: bash
        run: |
          tar -xzf qavante-web-open-next.tgz
          node - <<'NODE'
          const fs = require("node:fs");
          let config = fs.readFileSync("wrangler.toml", "utf8");
          const replaceOne = (pattern, replacement, name) => {
            const matches = config.match(new RegExp(pattern.source, pattern.flags + "g"));
            if (!matches || matches.length !== 1) throw new Error(`${name}: se esperaba exactamente un placeholder`);
            config = config.replace(pattern, replacement);
          };
          replaceOne(/^QAVANTE_RELEASE_SHA = "unreleased"$/m, `QAVANTE_RELEASE_SHA = "${process.env.RELEASE_SHA}"`, "release SHA");
          replaceOne(/^QAVANTE_RELEASE_BUNDLE_SHA256 = "unreleased"$/m, `QAVANTE_RELEASE_BUNDLE_SHA256 = "${process.env.BUNDLE_SHA256}"`, "bundle digest");
          fs.writeFileSync("wrangler.release.toml", config);
          NODE
          current_main="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).object.sha))')"
          test "$current_main" = "$RELEASE_SHA"
          npx wrangler deploy --config wrangler.release.toml
      - name: Capture deployed version and verify runtime provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
          RUNTIME_RELEASE_URL: https://app.qavante.com/api/release
        shell: bash
        run: |
          npx wrangler deployments list --json > deployed-versions.json
          node .github/release/verify-runtime.mjs
      - name: Write final release provenance
        if: always()
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const base = JSON.parse(fs.readFileSync("release-manifest.json", "utf8"));
          const read = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : null;
          fs.writeFileSync("release-provenance.json", JSON.stringify({
            ...base,
            github_artifact_id: process.env.ARTIFACT_ID,
            github_artifact_digest: process.env.ARTIFACT_DIGEST,
            rollback_candidates_before: read("rollback-candidates.json"),
            deployments_after: read("deployed-versions.json"),
            runtime_observation: read("runtime-release.json"),
            deployed_config_sha256: fs.existsSync("wrangler.release.toml")
              ? require("node:crypto").createHash("sha256").update(fs.readFileSync("wrangler.release.toml")).digest("hex")
              : null,
          }, null, 2) + "\n");
          NODE
      - name: Upload release and rollback provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ inputs.release_sha }}
          path: |
            release-provenance.json
            rollback-candidates.json
            deployed-versions.json
            runtime-release.json
            wrangler.release.toml
          if-no-files-found: warn
          retention-days: 90
      - name: Smoke against app.qavante.com
        env:
          SMOKE_BASE_URL: https://app.qavante.com
          SMOKE_API_URL: https://api.qavante.com
          SMOKE_RUT: ${{ secrets.PRODUCTION_SMOKE_RUT }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          bash scripts/install-playwright-ci.sh chromium
          npm run smoke

  notify-failure:
    name: Report blocked or failed production release
    runs-on: ubuntu-latest
    needs: [verify, build, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      issues: write
    steps:
      - name: Open or update operational incident
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const label = "deploy-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `🚨 El release quedó bloqueado, falló o no pudo verificarse. Si el fallo ocurrió después del paso Wrangler, producción puede haber cambiado y exige inspección/rollback explícito; un run rojo nunca prueba por sí solo que no hubo promoción.\n\nRun: ${runUrl}\nSHA solicitado: ${process.env.RELEASE_SHA}\nFecha (UTC): ${new Date().toISOString()}\n\nRevisar el job exacto, la procedencia disponible y docs/operations/deploy-runbook.md.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "🚨 Release a prod bloqueado, fallido o no verificado",
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            }
