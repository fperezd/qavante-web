name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    environment:
      name: production
      url: https://app.qavante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build OpenNext worker bundle
        run: npm run build:cloudflare
        # `NEXT_PUBLIC_*` se inlinea en build-time en el bundle del browser
        # (no se lee del `[vars]` de wrangler.toml, que es runtime del Worker).
        # Sin esto el cliente queda con API_URL="" → error config_missing en
        # login. Valores públicos (no secretos): mismos que wrangler.toml
        # [vars] y .env.example.
        env:
          NEXT_PUBLIC_API_URL: https://api.qavante.com
          NEXT_PUBLIC_APP_ENV: production
          # Site key pública de Turnstile (anti-bot signup). Inlinada en el
          # bundle del browser; la secret la valida el backend.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADpQkYv0x2Mvz7Xp
      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .

      # Riesgo operacional #1: deploy fallido pasando desapercibido (token CF
      # expirado 6→20 jun = ~2 semanas sin deploy, CI verde). Si el deploy falla,
      # abrimos/actualizamos un issue para que el rojo sea visible y accionable.
      - name: Avisar si el deploy a prod falló (issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "deploy-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `🚨 El deploy a producción (app.qavante.com) falló — prod NO se actualizó.\n\nRun: ${runUrl}\nCommit: ${context.sha}\nFecha (UTC): ${new Date().toISOString()}\n\nCausa típica: token de Cloudflare (\`CLOUDFLARE_API_TOKEN\`) expirado/revocado (error 10000), o build OpenNext roto. Ver runbook de deploy.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "🚨 Deploy a prod falló — prod desactualizado",
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            }

  smoke:
    name: Post-deploy smoke (prod)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium para tests con hidratación
        run: npx playwright install chromium --with-deps
      - name: Smoke contra app.qavante.com
        env:
          SMOKE_BASE_URL: https://app.qavante.com
          SMOKE_API_URL: https://api.qavante.com
          # Si los secrets no están configurados, los specs gated en
          # prod-health.smoke.spec.ts hacen test.skip por hasCreds=false.
          # El smoke HTTP-only y browser siguen corriendo siempre.
          SMOKE_RUT: ${{ secrets.SMOKE_RUT }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: npm run smoke
