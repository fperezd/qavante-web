name: Chromatic

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.tsx"
      - "src/**/*.css"
      - "src/**/*.stories.*"
      - ".storybook/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chromatic.yml"
  pull_request:
    paths:
      - "src/**/*.tsx"
      - "src/**/*.css"
      - "src/**/*.stories.*"
      - ".storybook/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chromatic.yml"
  workflow_dispatch:
    inputs:
      full_rebaseline:
        description: "Capturar todas las historias para re-establecer la línea base"
        type: boolean
        default: false

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Chromatic token
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "${CHROMATIC_PROJECT_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chromatic omitido: falta CHROMATIC_PROJECT_TOKEN."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.available == 'true'
        run: npm ci
      - if: steps.token.outputs.available == 'true'
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_rebaseline) }}
