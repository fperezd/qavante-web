name = "qavante-web"
main = ".open-next/worker.js"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "https://api.qavante.com"
NEXT_PUBLIC_APP_ENV = "production"
# Cloudflare Turnstile (anti-bot del signup). Site key PÚBLICA. El widget es
# client-side → el valor real lo inlinea el build (ver build env en
# deploy-cloudflare.yml); esto queda por consistencia/runtime.
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADpQkYv0x2Mvz7Xp"

# Feature flags de prod (ADR-0008/0012). Las pantallas gateadas son Server
# Components: resuelven `process.env.NEXT_PUBLIC_FF_*` en runtime del Worker,
# que se llena con estas `[vars]`. IMPORTANTE: viven ACÁ (versionado), NO en
# el panel de Cloudflare — `wrangler deploy` resetea las vars del Worker a
# este archivo en cada deploy, así que lo del panel se borra. Para activar/
# desactivar una pantalla: editar acá + merge a main (auto-deploya).
#
# Activadas 2026-05-30 tras ADR-0027 (backend acepta cookie en tesorería C3).
NEXT_PUBLIC_FF_CASH_FLOW_REPORT = "true"
NEXT_PUBLIC_FF_BANK_MOVEMENT_CLASSIFICATION = "true"
NEXT_PUBLIC_FF_CLASSIFICATION_RULES = "true"
# Reactivada 2026-05-31: CC-API arregló el 500 de GET /api/management/accounts/tree
# (verificado end-to-end por CC-API). Era el único bloqueante de esta pantalla.
NEXT_PUBLIC_FF_MANAGEMENT_ACCOUNTS = "true"
# Activada 2026-06-03: CC-API expuso GET /api/dashboard/summary aceptando cookie
# (verificado: 401 sin/with-bad cookie como /api/me, sin 500; shape == contrato
# FE-first). Inicio Ejecutivo (C8) LIVE. La page es Server Component → el flag
# resuelve en runtime del Worker.
NEXT_PUBLIC_FF_DASHBOARD_SUMMARY = "true"
# Inicio Ejecutivo v2 (rediseño aprobado 2026-07-12) — OFF: cableado a los contratos
# que ya existen, con degradación honesta; se activa cuando CC-API entregue Fase 2
# (collection-forecast, key_obligations, cash_sparkline, tendencia del Pulso). Con
# ON tiene prioridad sobre DASHBOARD_SUMMARY (misma fuente /api/dashboard/summary).
NEXT_PUBLIC_FF_INICIO_EJECUTIVO_V2 = "false"
# Libro de Ventas v2 (rediseño aprobado 2026-07-13) — ON (encendido 2026-07-14 por Fernando):
# reordena la pantalla a la jerarquía del Inicio (respuesta de dueño arriba + tabla que sube +
# concentración top-10 lateral, sin toggle "Agrupar N/C"). Volver al clásico = poner en "false".
# Los 3 comparativos del ritmo se calculan en el FE (bajan los meses que faltan) y degradan por
# comparativo si algún mes falla, hasta que CC-API entregue el endpoint (ver libro-comparativos-contract).
NEXT_PUBLIC_FF_LIBRO_VENTAS_V2 = "true"
# Libro de Compras v2 (mismo rediseño, análogo a Ventas) en /pagar/facturas-recibidas.
# ON (encendido 2026-07-14). Flag independiente de Ventas.
NEXT_PUBLIC_FF_LIBRO_COMPRAS_V2 = "true"
# Caja v2 (rediseño aprobado 2026-07-14) — OFF: Resumen con la respuesta de dueño + la curva
# de saldo que cae y toca el piso (derivada del saldo + netos del reporte de caja). Con OFF, el
# reporte clásico /caja/proyeccion queda intacto. Saldo por banco degrada al total (bice/saldo
# api-key-only). Se enciende cuando esté validado.
NEXT_PUBLIC_FF_CAJA_V2 = "false"
# Activadas 2026-06-21: CC-API confirmó que estos endpoints aceptan la cookie de
# sesión (require_api_key_or_session; Mi-cuenta es cookie-only by design). Con
# F9 permitiendo app.qavante.com/qavante.com y cookie Domain=.qavante.com, llega
# y se acepta. Lote: SII, Monedas, Vistas de gestión, Plantillas, Mi cuenta.
NEXT_PUBLIC_FF_SII_QUERIES = "true"
NEXT_PUBLIC_FF_MULTI_CURRENCY = "true"
NEXT_PUBLIC_FF_MANAGEMENT_DIMENSIONS = "true"
NEXT_PUBLIC_FF_INDUSTRY_TEMPLATES = "true"
NEXT_PUBLIC_FF_MI_CUENTA = "true"
# Activadas 2026-06-21: CC-API construyó accounts-receivable/payable +
# operational-result + management/pulso (404→401), schemas verificados vs
# contratos FE (top-level + anidados + enums). Pendiente confirmar que aceptan
# cookie (un 401 en query de datos dispara redirectToLogin → si fueran
# api-key-only, expulsa al usuario). Flip retenido hasta verde de CC-API.
NEXT_PUBLIC_FF_ACCOUNTS_RECEIVABLE = "true"
NEXT_PUBLIC_FF_ACCOUNTS_PAYABLE = "true"
NEXT_PUBLIC_FF_OPERATIONAL_RESULT = "true"
NEXT_PUBLIC_FF_PULSO_DETAIL = "true"
# Activada 2026-06-22: wizard de onboarding. CC-API dejó vivos en prod todos los
# endpoints (qavante-api #344 status/complete + onboarding_completed en /me, #345
# sync per-source, #346 opening-balance; signup/verify ya estaban). FE alineado a
# tipos generados (PR #337). Backfill onboarding_completed=true en tenants
# existentes CONFIRMADO por Fernando → el guard no arrastra usuarios actuales al
# wizard. Pasos SII/banco son opcionales y blindados (skipAuthRetry: un 401 ahí
# muestra error inline, no expulsa al login).
NEXT_PUBLIC_FF_ONBOARDING = "true"
# Activada 2026-06-25 (sesión autónoma): Préstamos y obligaciones (Pagar). CC-API
# shipeó GET/POST /api/treasury/obligations + detalle + reconcile; verificado que
# usan auth por COOKIE de sesión (GET sin auth → 401 no_session, igual que
# treasury; NO api-key-only como SII). Gating server-side (las pages resuelven el
# flag → Worker [vars]). Degradación elegante si el endpoint falla (error inline,
# no expulsa). FE construido en #346/#347/#348.
NEXT_PUBLIC_FF_OBLIGATIONS = "true"
# Activada 2026-06-28: indicador de sincronización del header. CC-API migró
# /api/sources/status a require_session (cookie) en #388 — verificado en prod
# (GET sin auth → 401 no_session, ya no "Falta X-Api-Key"). Gating server-side
# (layout → shell → header). Degradación elegante: si falla, el indicador no se
# muestra (no rompe el header).
NEXT_PUBLIC_FF_SYNC_STATUS = "true"
# Activada 2026-07-03: sección Remuneraciones (BUK) — Dotación + Planilla. CC-API
# confirmó que /api/buk/* acepta cookie de sesión. FE construido en #382-#387
# (gated). Gating server-side (layout → shell → nav "Equipo"; page server-gated).
# Degradación elegante: si el endpoint falla, error inline (no rompe la nav).
NEXT_PUBLIC_FF_REMUNERACIONES = "true"

# Custom domain declarativo. Idempotente: si el binding ya existe en el
# dashboard (creado manualmente el 2026-05-12), wrangler lo respeta. Si se
# recrea el Worker, este bloque lo restaura. Requiere que la zona qavante.com
# esté en la misma cuenta de Cloudflare (sí: account 8783bdbfcb...).
[[routes]]
pattern = "app.qavante.com"
custom_domain = true
