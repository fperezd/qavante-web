name = "qavante-web"
main = ".open-next/worker.js"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "https://api.qavante.com"
NEXT_PUBLIC_APP_ENV = "production"
# Cloudflare Turnstile (anti-bot del signup). Site key PÚBLICA. El widget es
# client-side → el valor real lo inlinea el build (ver build env en
# deploy-cloudflare.yml); esto queda por consistencia/runtime.
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADpQkYv0x2Mvz7Xp"

# Feature flags de prod (ADR-0008/0012). Las pantallas gateadas son Server
# Components: resuelven `process.env.NEXT_PUBLIC_FF_*` en runtime del Worker,
# que se llena con estas `[vars]`. IMPORTANTE: viven ACÁ (versionado), NO en
# el panel de Cloudflare — `wrangler deploy` resetea las vars del Worker a
# este archivo en cada deploy, así que lo del panel se borra. Para activar/
# desactivar una pantalla: editar acá + merge a main (auto-deploya).
#
# Activadas 2026-05-30 tras ADR-0027 (backend acepta cookie en tesorería C3).
NEXT_PUBLIC_FF_CASH_FLOW_REPORT = "true"
NEXT_PUBLIC_FF_BANK_MOVEMENT_CLASSIFICATION = "true"
NEXT_PUBLIC_FF_CLASSIFICATION_RULES = "true"
# Reactivada 2026-05-31: CC-API arregló el 500 de GET /api/management/accounts/tree
# (verificado end-to-end por CC-API). Era el único bloqueante de esta pantalla.
NEXT_PUBLIC_FF_MANAGEMENT_ACCOUNTS = "true"
# Activada 2026-06-03: CC-API expuso GET /api/dashboard/summary aceptando cookie
# (verificado: 401 sin/with-bad cookie como /api/me, sin 500; shape == contrato
# FE-first). Inicio Ejecutivo (C8) LIVE. La page es Server Component → el flag
# resuelve en runtime del Worker.
NEXT_PUBLIC_FF_DASHBOARD_SUMMARY = "true"
# Inicio Ejecutivo v2 (rediseño aprobado 2026-07-12) — ON (encendido 2026-08-08 por Fernando para
# probar el framework de widgets + la agenda). Cableado a los contratos que ya existen, con degradación
# honesta (algunos campos Fase 2 —key_obligations/cash_sparkline/tendencia del Pulso— aún caen a lo del
# v1 hasta que CC-API los entregue). Grilla de tarjetas reordenable. Con ON tiene prioridad sobre
# DASHBOARD_SUMMARY (misma fuente). Volver al v1 = "false".
NEXT_PUBLIC_FF_INICIO_EJECUTIVO_V2 = "true"
# Libro de Ventas v2 (rediseño aprobado 2026-07-13) — ON (encendido 2026-07-14 por Fernando):
# reordena la pantalla a la jerarquía del Inicio (respuesta de dueño arriba + tabla que sube +
# concentración top-10 lateral, sin toggle "Agrupar N/C"). Volver al clásico = poner en "false".
# Los 3 comparativos del ritmo se calculan en el FE (bajan los meses que faltan) y degradan por
# comparativo si algún mes falla, hasta que CC-API entregue el endpoint (ver libro-comparativos-contract).
NEXT_PUBLIC_FF_LIBRO_VENTAS_V2 = "true"
# Libro de Compras v2 (mismo rediseño, análogo a Ventas) en /pagar/facturas-recibidas.
# ON (encendido 2026-07-14). Flag independiente de Ventas.
NEXT_PUBLIC_FF_LIBRO_COMPRAS_V2 = "true"
# Caja v2 (rediseño aprobado 2026-07-14) — ON (encendido 2026-07-14 por Fernando): Resumen con la
# respuesta de dueño + la curva de saldo que cae y toca el piso (derivada del saldo + netos del
# reporte de caja). Con OFF, el reporte clásico /caja/proyeccion queda intacto. Saldo por banco
# degrada al total (bice/saldo api-key-only). Volver al clásico = poner en "false".
NEXT_PUBLIC_FF_CAJA_V2 = "true"
# Caja v3 (rediseño visual 2026-07-20) — ON (encendido 2026-07-21 por Fernando, tras validación live
# contra Tooxs + fix #661 del doble-conteo past-due). Reemplaza la curva de "Saldo proyectado" por un
# medidor de días de caja + cascada de próximos movimientos, derivados de los vencimientos (mismo
# motor que Cobrar/Pagar), con estado honesto si no hay proyección. La proyección usa un grace de 7d
# para el past-due (heurístico hasta que CC-API dé el estado "pagado" por documento vía conciliación
# bancaria — escalado). Volver al clásico = "false".
NEXT_PUBLIC_FF_CAJA_V3 = "true"
# Saldos de banco + LÍNEA DE CRÉDITO en Caja — ON (encendido 2026-08-04 por Fernando). CC-API migró
# /api/bice/* a require_session (sondeado: `no_session`, ya no api-key-only), así que el FE consume el
# saldo por cuenta + el balance con la LC (cupo/usado/disponible + venc. sobregiro) con la cookie.
# Validado al peso contra Tooxs (cupo $6M usado al 101%, excedido $58.864). Apagar = "false".
NEXT_PUBLIC_FF_BANK_BALANCES = "true"
# Pantalla Banco — ON (encendido 2026-08-04 por Fernando): productos del tenant por banco (cuentas +
# tarjetas de crédito). Consume /api/bice/* (cookie). Volver a ocultar = poner en "false".
NEXT_PUBLIC_FF_BANCO_SCREEN = "true"
# Conciliación POR movimiento en el detalle de una cuenta de Banco (Fase 2) — ON (encendido 2026-08-07
# por Fernando). Cada movimiento "Por conciliar" con match propuesto (cola reconciliation/review cruzada
# por movement_id) ofrece "Conciliar" / "Rechazar" + tab "Sugerencias". Path confirm probado en vivo por
# /caja/conciliacion (mismo endpoint, LIVE desde julio) y la cola quedó limpia tras el fix de match de
# CC-API #855 (falsos positivos por monto excluidos; validado al peso 46→12). Apagar = "false".
NEXT_PUBLIC_FF_BANCO_CONCILIACION = "true"
# Pulso configurable por OBJETIVO (2026-08-06) — OFF hasta que CC-API honre `?objetivo=` en
# /api/management/pulso (hoy lo ignora → devolvería el Pulso equilibrado, sin número falso). El dueño
# elige qué prioriza (cuidar caja / cumplir pagos / crecer / equilibrado) y el backend re-pondera los
# ejes. Con OFF el Pulso detalle queda como está (cero regresión). Encender tras el backend = "true".
NEXT_PUBLIC_FF_PULSO_OBJETIVO = "false"
# Comportamiento de pago en Ciclo de caja (2026-08-06) — OFF hasta validar al peso el
# behavior_shift_days de /api/treasury/collection-projection. Complementa el DSO con el desfase real vs
# vencimiento (agregado de cobros); primer paso hacia la temporalidad por contraparte (brecha CC-API
# qavante-api #858). Con OFF, Ciclo de caja queda igual (cero regresión). Encender = "true".
NEXT_PUBLIC_FF_COMPORTAMIENTO_PAGO = "false"
# Personalizar el Inicio (2026-08-08) — OFF hasta validar. El dueño prende/apaga las tarjetas del
# Inicio v2 (mover ya existe: DraggableCard). Fundación del norte "la mañana del dueño". Persiste en
# prefs (inicio_widget_hidden). Requiere INICIO_EJECUTIVO_V2 ON para verse. Con OFF el Inicio queda
# igual (cero regresión). Encender = "true".
NEXT_PUBLIC_FF_INICIO_WIDGETS = "true"
# Agenda de las próximas 2 semanas en el Inicio (2026-08-08) — OFF hasta validar. Tarjeta que compone
# los vencimientos forward (cobros AR + pagos AP + F29/Previred/sueldos/arriendo) a 14 días, por semana.
# Reusa el motor de la cascada de Caja. Requiere INICIO_EJECUTIVO_V2 ON para verse. Con OFF el Inicio
# queda igual (cero regresión). Encender = "true".
NEXT_PUBLIC_FF_INICIO_AGENDA = "true"
# Conciliación de sueldos ACCIONABLE en Remuneraciones (#835) — ON (encendido 2026-08-05 por Fernando).
# El board del backend (payroll-settlements/reconcile/revert, qavante-api #826/#827) es la fuente de
# verdad; deja conciliar una-a-una / varias marcadas y DESASIGNAR (caso Carrasco). Validado al peso con
# la sesión de Fernando: el shape del board calza con `normalizeBoard`; y como los débitos de sueldos
# reales NO vienen categorizados (salen como "Cargo nómina en línea"/"Transf. a terceros"), los
# candidatos se descubren por glosa payroll O por calce de monto con el líquido del trabajador (#848).
# Apagar = "false" (vuelve la Conciliación pasiva por-monto, sin regresión).
NEXT_PUBLIC_FF_PAYROLL_RECONCILE_BOARD = "true"
# Pagar v2 (rediseño aprobado 2026-07-14) — ON (encendido 2026-07-14 por Fernando): respuesta de
# dueño (cuánto debe pagar + ¿la caja alcanza?) + brecha de caja + las 3 del mes (imposiciones/
# impuestos/sueldos) + vencimientos con postergabilidad + mayores compromisos. Reusa accounts-payable
# (accountsPayable) para el dato. Con ON tiene prioridad sobre el Pagar clásico. La postergabilidad es
# HEURÍSTICA hasta que CC-API mande el flag por ítem (brecha abierta). Volver al clásico = "false".
NEXT_PUBLIC_FF_PAGAR_V2 = "true"
# Cobrar v2 (rediseño 2026-07-19) — ON (encendido 2026-07-19 por Fernando): respuesta de dueño
# ("a quién le cobras primero") + acciones reales de cobranza (copiar recordatorio chileno,
# WhatsApp/mail sin destinatario, marcar gestionado persistido en prefs #571). Reusa
# accounts-receivable. Dos modos honestos: urgencia (hay mora) / concentración (sin vencimientos del
# SII — caso Tooxs hoy: prioriza por tamaño y lo dice). Con ON tiene prioridad sobre el Cobrar
# clásico. Volver al clásico = poner en "false".
NEXT_PUBLIC_FF_COBRAR_V2 = "true"
# (Gestión v2 dejó de ser un flag: la vista clásica se retiró y v2 es la única. Antes vivía acá
# NEXT_PUBLIC_FF_GESTION_V2; se removió al retirar el clásico — el flag quedaba muerto.)
# Cola de conciliación (ADR-0036/0042) — pantalla /caja/conciliacion + card en la landing de Caja.
# El motor auto-aplica los matches con score >=90 y deja los 60-90 en cola de revisión (confirmar/
# rechazar/conciliar todas) + botón "Conciliar ahora" (POST /reconcile). ON 2026-07-17 (pedido de
# Fernando) para mirar la feature con datos reales; `.../review` acepta cookie. Apagar = "false".
NEXT_PUBLIC_FF_RECONCILIATION_REVIEW = "true"
# Activadas 2026-06-21: CC-API confirmó que estos endpoints aceptan la cookie de
# sesión (require_api_key_or_session; Mi-cuenta es cookie-only by design). Con
# F9 permitiendo app.qavante.com/qavante.com y cookie Domain=.qavante.com, llega
# y se acepta. Lote: SII, Monedas, Vistas de gestión, Plantillas, Mi cuenta.
NEXT_PUBLIC_FF_SII_QUERIES = "true"
NEXT_PUBLIC_FF_MULTI_CURRENCY = "true"
NEXT_PUBLIC_FF_MANAGEMENT_DIMENSIONS = "true"
NEXT_PUBLIC_FF_INDUSTRY_TEMPLATES = "true"
NEXT_PUBLIC_FF_MI_CUENTA = "true"
# Activadas 2026-06-21: CC-API construyó accounts-receivable/payable +
# operational-result + management/pulso (404→401), schemas verificados vs
# contratos FE (top-level + anidados + enums). Pendiente confirmar que aceptan
# cookie (un 401 en query de datos dispara redirectToLogin → si fueran
# api-key-only, expulsa al usuario). Flip retenido hasta verde de CC-API.
NEXT_PUBLIC_FF_ACCOUNTS_RECEIVABLE = "true"
NEXT_PUBLIC_FF_ACCOUNTS_PAYABLE = "true"
NEXT_PUBLIC_FF_OPERATIONAL_RESULT = "true"
NEXT_PUBLIC_FF_PULSO_DETAIL = "true"
# Piloto (2026-08-08) Gestión como tablero reordenable (cards movibles/apagables, motor iPad del Inicio).
# OFF hasta que Fernando lo valide → con OFF la Gestión queda IGUAL (informe/matriz), cero regresión.
NEXT_PUBLIC_FF_GESTION_DASHBOARD = "true"
# Piloto (2026-08-08) Caja como landing reordenable (bloques movibles/apagables). OFF hasta validar →
# con OFF la Caja queda IGUAL, cero regresión.
NEXT_PUBLIC_FF_CAJA_DASHBOARD = "false"
# Pantalla Presupuesto propositivo (2026-08-09). ON: Fernando la quiere en el menú. Degrada honesto
# (sin presupuesto → botón "Proponer"); backend #870 en prod.
NEXT_PUBLIC_FF_PRESUPUESTO = "true"
# Administración → MCP (2026-08-10): conectar la empresa a un asistente LLM + gestión de API-keys.
# ON (encendido 2026-08-11 por Fernando). La pantalla es un config: el dueño crea/revoca la API-key a
# mano; no expone nada por sí sola. Backend #882/#888 en prod. Apagar = "false".
NEXT_PUBLIC_FF_MCP = "true"
# Activada 2026-06-22: wizard de onboarding. CC-API dejó vivos en prod todos los
# endpoints (qavante-api #344 status/complete + onboarding_completed en /me, #345
# sync per-source, #346 opening-balance; signup/verify ya estaban). FE alineado a
# tipos generados (PR #337). Backfill onboarding_completed=true en tenants
# existentes CONFIRMADO por Fernando → el guard no arrastra usuarios actuales al
# wizard. Pasos SII/banco son opcionales y blindados (skipAuthRetry: un 401 ahí
# muestra error inline, no expulsa al login).
NEXT_PUBLIC_FF_ONBOARDING = "true"
# Activada 2026-06-25 (sesión autónoma): Préstamos y obligaciones (Pagar). CC-API
# shipeó GET/POST /api/treasury/obligations + detalle + reconcile; verificado que
# usan auth por COOKIE de sesión (GET sin auth → 401 no_session, igual que
# treasury; NO api-key-only como SII). Gating server-side (las pages resuelven el
# flag → Worker [vars]). Degradación elegante si el endpoint falla (error inline,
# no expulsa). FE construido en #346/#347/#348.
NEXT_PUBLIC_FF_OBLIGATIONS = "true"
# Activada 2026-06-28: indicador de sincronización del header. CC-API migró
# /api/sources/status a require_session (cookie) en #388 — verificado en prod
# (GET sin auth → 401 no_session, ya no "Falta X-Api-Key"). Gating server-side
# (layout → shell → header). Degradación elegante: si falla, el indicador no se
# muestra (no rompe el header).
NEXT_PUBLIC_FF_SYNC_STATUS = "true"
# Activada 2026-07-03: sección Remuneraciones (BUK) — Dotación + Planilla. CC-API
# confirmó que /api/buk/* acepta cookie de sesión. FE construido en #382-#387
# (gated). Gating server-side (layout → shell → nav "Equipo"; page server-gated).
# Degradación elegante: si el endpoint falla, error inline (no rompe la nav).
NEXT_PUBLIC_FF_REMUNERACIONES = "true"

# Custom domain declarativo. Idempotente: si el binding ya existe en el
# dashboard (creado manualmente el 2026-05-12), wrangler lo respeta. Si se
# recrea el Worker, este bloque lo restaura. Requiere que la zona qavante.com
# esté en la misma cuenta de Cloudflare (sí: account 8783bdbfcb...).
[[routes]]
pattern = "app.qavante.com"
custom_domain = true
