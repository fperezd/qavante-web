name = "qavante-web"
main = ".open-next/worker.js"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "https://tooxs-gestion-api.fly.dev"
NEXT_PUBLIC_APP_ENV = "production"

# Custom domain declarativo. Idempotente: si el binding ya existe en el
# dashboard (creado manualmente el 2026-05-12), wrangler lo respeta. Si se
# recrea el Worker, este bloque lo restaura. Requiere que la zona qavante.com
# esté en la misma cuenta de Cloudflare (sí: account 8783bdbfcb...).
[[routes]]
pattern = "app.qavante.com"
custom_domain = true
