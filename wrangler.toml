name = "qavante-web"
main = ".open-next/worker.js"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "https://api.qavante.com"
NEXT_PUBLIC_APP_ENV = "production"

# Feature flags de prod (ADR-0008/0012). Las pantallas gateadas son Server
# Components: resuelven `process.env.NEXT_PUBLIC_FF_*` en runtime del Worker,
# que se llena con estas `[vars]`. IMPORTANTE: viven ACÁ (versionado), NO en
# el panel de Cloudflare — `wrangler deploy` resetea las vars del Worker a
# este archivo en cada deploy, así que lo del panel se borra. Para activar/
# desactivar una pantalla: editar acá + merge a main (auto-deploya).
#
# Activadas 2026-05-30 tras ADR-0027 (backend acepta cookie en tesorería C3).
NEXT_PUBLIC_FF_CASH_FLOW_REPORT = "true"
NEXT_PUBLIC_FF_BANK_MOVEMENT_CLASSIFICATION = "true"
NEXT_PUBLIC_FF_CLASSIFICATION_RULES = "true"
# Reactivada 2026-05-31: CC-API arregló el 500 de GET /api/management/accounts/tree
# (verificado end-to-end por CC-API). Era el único bloqueante de esta pantalla.
NEXT_PUBLIC_FF_MANAGEMENT_ACCOUNTS = "true"

# Custom domain declarativo. Idempotente: si el binding ya existe en el
# dashboard (creado manualmente el 2026-05-12), wrangler lo respeta. Si se
# recrea el Worker, este bloque lo restaura. Requiere que la zona qavante.com
# esté en la misma cuenta de Cloudflare (sí: account 8783bdbfcb...).
[[routes]]
pattern = "app.qavante.com"
custom_domain = true
